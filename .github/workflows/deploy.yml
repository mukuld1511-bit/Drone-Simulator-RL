name: CI/CD — Build & Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

# Prevent concurrent deployments — cancel old run if new push comes in
concurrency:
  group: azure-deploy
  cancel-in-progress: true

jobs:
  # ──────────────────────────────────────────────
  # JOB 1: Build Python Backend
  # ──────────────────────────────────────────────
  build-backend:
    name: Build Python Backend
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies for Azure
        run: |
          pip install --target=".python_packages/lib/site-packages" -r python_code/requirements.txt

      - name: Upload backend artifact
        uses: actions/upload-artifact@v4
        with:
          name: python-app
          path: |
            .
            !.git/

  # ──────────────────────────────────────────────
  # JOB 2: Deploy Backend → Azure
  # Backend deploy removed - use Azure Deployment Center natively
